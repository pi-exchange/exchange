name: Lab 2 documentation
on:
  push:
    branches: [lab-2, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-lab2.py
      - run: python scripts/check-contract.py
